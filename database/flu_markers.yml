# Influenza phenotype marker catalogue
#
# Curated mutation -> phenotype catalogue used by flu_segment_signatures.py to
# screen per-segment query mutations for known antiviral-resistance,
# host-adaptation and virulence markers.
#
# UPDATE PROCEDURE: this file is a repo-committed snapshot of published
# surveillance tables, not a live feed. When a source table is revised,
# transcribe the new/changed entries here and bump `source_date` in the
# entry's `source` block and in `catalog_meta.table_dates`.
#
# Sources:
#   * WHO GISRS NAI marker table — "Summary of neuraminidase amino acid
#     substitutions associated with reduced inhibition by neuraminidase
#     inhibitors" (who.int > Global Influenza Programme > antiviral
#     susceptibility), 07.03.2023 update.
#   * WHO GISRS PA marker table — "Summary of polymerase acidic protein (PA)
#     amino acid substitutions assessed for their effects on baloxavir
#     susceptibility", 28.11.2025 update.
#   * WHO M2 inhibitor page — adamantane resistance substitutions in the M2
#     transmembrane domain (residues 26-34).
#   * CDC H5N1 Genetic Changes Inventory (WHO CC Atlanta, June 2012 release)
#     — amino acid changes with phenotypic effects in H5N1 viruses.
#
# Field reference:
#   gene / segment      gene symbol and genome segment
#   position / alt      codon position and substituted amino acid(s)
#   category            antiviral_resistance | host_adaptation | virulence |
#                       antigenic | receptor_binding
#   phenotype           short human-readable phenotype statement
#   drug                affected drug (resistance markers only)
#   effect              resistance | reduced_susceptibility | associated —
#                       the WHO evidence tier wording
#   confidence          established (clinical/surveillance + phenotypic data)
#                       | suspected (in-vitro / RG only)
#   coordinate_system   segment_cds  — position counted from segment CDS start
#                                    (matches our mutation tables directly)
#                       n1_numbering — WHO convention: NA positions are given
#                                    in N1 numbering regardless of subtype
#                       h_numbering  — HA positions in the mature-protein
#                                    numbering used by H3/H5 literature
#                                    (excludes signal peptide)
#   subtype_scope       subtype(s) the marker was characterized in; matching
#                       still reports cross-subtype hits with a caveat
#   refs                representative citations (PMIDs or source-table refs)

catalog_meta:
  name: influenza_markers
  version: "1.0"
  created: 2025-12
  sources:
    - id: who_nai_table
      url: https://www.who.int/teams/global-influenza-programme/laboratory-network/quality-assurance/antiviral-susceptibility-influenza/neuraminidase-inhibitor
      table_date: 2023-03-07
    - id: who_pa_table
      url: https://www.who.int/teams/global-influenza-programme/laboratory-network/quality-assurance/antiviral-susceptibility-influenza
      table_date: 2025-11-28
    - id: who_m2_page
      url: https://www.who.int/teams/global-influenza-programme/laboratory-network/quality-assurance/antiviral-susceptibility-influenza
      table_date: 2024-01-01
    - id: cdc_h5n1_inventory
      url: https://archive.cdc.gov/www_cdc_gov/flu/avianflu/h5n1-genetic-changes.htm
      table_date: 2012-06-26

