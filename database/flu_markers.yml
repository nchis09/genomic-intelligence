    position: null
    alt: [RRKKR, RKKR, KRRKR]
    category: virulence
    phenotype: "Polybasic cleavage motif at HA1/HA2 junction — required for highly pathogenic avian influenza phenotype"
    effect: associated
    confidence: established
    coordinate_system: h_numbering
