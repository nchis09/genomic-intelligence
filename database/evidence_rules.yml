      - {literal: "probe", label: "PRIMER", pattern: [{LOWER: probe}]}
      - {literal: "forward primer", label: "PRIMER", pattern: [{LOWER: forward}, {LOWER: primer}]}
      - {literal: "reverse primer", label: "PRIMER", pattern: [{LOWER: reverse}, {LOWER: primer}]}
      - {literal: "TaqMan probe", label: "PRIMER", pattern: [{ORTH: TaqMan}, {LOWER: probe}]}
    value_type: string
    context_filters: [negated]
  - field: age_group
    target_rules:
      - {literal: "children", label: "AGE", pattern: [{LOWER: children}]}
      - {literal: "adults", label: "AGE", pattern: [{LOWER: adults}]}
      - {literal: "age group", label: "AGE", pattern: [{LOWER: age}, {LOWER: group}]}
