    context_filters: [negated]
  - field: gender
    target_rules:
      - {literal: "male", label: "GENDER", pattern: [{LOWER: male}]}
      - {literal: "female", label: "GENDER", pattern: [{LOWER: female}]}
    value_type: string
    context_filters: [negated]
  - field: geographic_location
    target_rules:
      - {literal: "conducted in", label: "LOCATION", pattern: [{LOWER: conducted}, {LOWER: in}]}
      - {literal: "study site", label: "LOCATION", pattern: [{LOWER: study}, {LOWER: site}]}
      - {literal: "reported in", label: "LOCATION", pattern: [{LOWER: reported}, {LOWER: in}]}
      - {literal: "outbreak in", label: "LOCATION", pattern: [{LOWER: outbreak}, {LOWER: in}]}
    value_regex: '(?:conducted|located|reported|identified|outbreak)\\s+(?:in|at|across|throughout)\\s+([A-Z][A-Za-z]+(?:\\s+[A-Z][A-Za-z]+)*(?:,\\s*[A-Za-z\\s]+)?)'
