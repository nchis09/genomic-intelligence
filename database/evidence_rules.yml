---
# MedSpaCy extraction rules for per-domain evidence fields.
# Each domain defines a list of fields with:
#   - target_rules: MedSpaCy TargetRule entries (literal + label + optional spaCy pattern)
#   - value_regex: regex to extract numeric/string values near the matched concept
#   - value_type: "string" (first match), "list" (all matches), "number", "boolean"
#   - context_filters: ConText modifiers to EXCLUDE (e.g., negated, uncertain, historical)
#   - section_boost: sections where a match gets "high" confidence (e.g., results, conclusions)

seroprevalence:
  - field: study_location
    target_rules:
      - {literal: "seroprevalence study", label: "STUDY"}
      - {literal: "serological survey", label: "STUDY"}
    value_type: string
    context_filters: [negated, uncertain]
  - field: host_species
    target_rules:
      - {literal: "bats", label: "HOST", pattern: [{LOWER: bats}]}
      - {literal: "primates", label: "HOST"}
      - {literal: "rodents", label: "HOST"}
      - {literal: "fruit bats", label: "HOST"}
      - {literal: "humans", label: "HOST", pattern: [{LOWER: humans}]}
      - {literal: "healthcare workers", label: "HOST", pattern: [{LOWER: healthcare}, {LOWER: workers}]}
      - {literal: "survivors", label: "HOST"}
    value_type: list
    context_filters: [negated]
  - field: sample_size
    target_rules:
      - {literal: "samples were collected", label: "SAMPLE_SIZE"}
      - {literal: "individuals were tested", label: "SAMPLE_SIZE"}
      - {literal: "sera were collected", label: "SAMPLE_SIZE"}
      - {literal: "participants", label: "SAMPLE_SIZE"}
    value_regex: '(\\d[\\d,]*)\\s+(?:samples|individuals|sera|participants|specimens|subjects)'
    value_type: number
    context_filters: [negated, uncertain]
  - field: seroprevalence_value
    target_rules:
      - {literal: "seroprevalence", label: "METRIC"}
      - {literal: "seropositivity", label: "METRIC"}
      - {literal: "antibody prevalence", label: "METRIC", pattern: [{LOWER: antibody}, {LOWER: prevalence}]}
      - {literal: "seropositive rate", label: "METRIC", pattern: [{LOWER: seropositive}, {LOWER: rate}]}
    value_regex: '(\\d+\.?\\d*)\\s*%'
    value_type: string
    context_filters: [negated, uncertain]
    section_boost: [results, conclusions]
  - field: assay_used
    target_rules:
      - {literal: "ELISA", label: "ASSAY", pattern: [{ORTH: ELISA}]}
      - {literal: "RT-PCR", label: "ASSAY", pattern: [{ORTH: RT}, {ORTH: "-"}, {ORTH: PCR}]}
      - {literal: "real-time PCR", label: "ASSAY", pattern: [{LOWER: real}, {ORTH: "-"}, {LOWER: time}, {ORTH: PCR}]}
      - {literal: "Western blot", label: "ASSAY", pattern: [{ORTH: Western}, {LOWER: blot}]}
      - {literal: "IgG ELISA", label: "ASSAY", pattern: [{ORTH: IgG}, {ORTH: ELISA}]}
      - {literal: "IgM ELISA", label: "ASSAY", pattern: [{ORTH: IgM}, {ORTH: ELISA}]}
      - {literal: "indirect immunofluorescence", label: "ASSAY"}
      - {literal: "neutralization assay", label: "ASSAY", pattern: [{LOWER: neutralization}, {LOWER: assay}]}
      - {literal: "luciferase immunoprecipitation", label: "ASSAY"}
    value_type: list
    context_filters: [negated]
  - field: antigen_target
    target_rules:
      - {literal: "glycoprotein", label: "ANTIGEN", pattern: [{LOWER: glycoprotein}]}
      - {literal: "nucleoprotein", label: "ANTIGEN", pattern: [{LOWER: nucleoprotein}]}
      - {literal: "VP40", label: "ANTIGEN"}
      - {literal: "NP antigen", label: "ANTIGEN", pattern: [{ORTH: NP}, {LOWER: antigen}]}
      - {literal: "GP antigen", label: "ANTIGEN", pattern: [{ORTH: GP}, {LOWER: antigen}]}
      - {literal: "recombinant antigen", label: "ANTIGEN", pattern: [{LOWER: recombinant}, {LOWER: antigen}]}
    value_type: list
    context_filters: [negated]
  - field: sampling_period
    target_rules:
      - {literal: "samples were collected", label: "PERIOD"}
      - {literal: "study period", label: "PERIOD", pattern: [{LOWER: study}, {LOWER: period}]}
      - {literal: "between", label: "PERIOD"}
    value_regex: '(?:between|from|during)\\s+(\\d{4}\\s*(?:to|[-–])\\s*\\d{4})'
    value_type: string
    context_filters: [negated]
  - field: age_group
    target_rules:
      - {literal: "children", label: "AGE", pattern: [{LOWER: children}]}
      - {literal: "adults", label: "AGE", pattern: [{LOWER: adults}]}
      - {literal: "elderly", label: "AGE", pattern: [{LOWER: elderly}]}
      - {literal: "pediatric", label: "AGE", pattern: [{LOWER: pediatric}]}
      - {literal: "age group", label: "AGE", pattern: [{LOWER: age}, {LOWER: group}]}
      - {literal: "age range", label: "AGE", pattern: [{LOWER: age}, {LOWER: range}]}
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(patients|participants|individuals|people)\\b'
  - field: gender
    target_rules:
      - {literal: "male", label: "GENDER", pattern: [{LOWER: male}]}
      - {literal: "female", label: "GENDER", pattern: [{LOWER: female}]}
      - {literal: "sex distribution", label: "GENDER", pattern: [{LOWER: sex}, {LOWER: distribution}]}
      - {literal: "gender distribution", label: "GENDER", pattern: [{LOWER: gender}, {LOWER: distribution}]}
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(patients|participants|individuals|people)\\b'
  - field: geographic_location
    target_rules:
      - {literal: "conducted in", label: "LOCATION", pattern: [{LOWER: conducted}, {LOWER: in}]}
      - {literal: "study was conducted", label: "LOCATION"}
      - {literal: "located in", label: "LOCATION", pattern: [{LOWER: located}, {LOWER: in}]}
      - {literal: "reported in", label: "LOCATION", pattern: [{LOWER: reported}, {LOWER: in}]}
      - {literal: "outbreak in", label: "LOCATION", pattern: [{LOWER: outbreak}, {LOWER: in}]}
    value_regex: '(?:conducted|located|reported|identified|outbreak)\\s+(?:in|at|across|throughout)\\s+([A-Z][A-Za-z]+(?:\\s+[A-Z][A-Za-z]+)*(?:,\\s*[A-Za-z\\s]+)?)'
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(outbreak|cases|patients|study|survey|samples|detected|reported)\\b'

variant_phenotype:
  - field: gene
    target_rules:
      - {literal: "glycoprotein gene", label: "GENE", pattern: [{LOWER: glycoprotein}, {LOWER: gene}]}
      - {literal: "nucleoprotein gene", label: "GENE", pattern: [{LOWER: nucleoprotein}, {LOWER: gene}]}
      - {literal: "polymerase gene", label: "GENE", pattern: [{LOWER: polymerase}, {LOWER: gene}]}
      - {literal: "VP35", label: "GENE"}
      - {literal: "VP40", label: "GENE"}
      - {literal: "GP gene", label: "GENE", pattern: [{ORTH: GP}, {LOWER: gene}]}
      - {literal: "NP gene", label: "GENE", pattern: [{ORTH: NP}, {LOWER: gene}]}
    value_type: string
    context_filters: [negated]
  - field: mutation
    target_rules:
      - {literal: "mutation", label: "MUTATION", pattern: [{LOWER: mutation}]}
      - {literal: "substitution", label: "MUTATION", pattern: [{LOWER: substitution}]}
      - {literal: "amino acid change", label: "MUTATION", pattern: [{LOWER: amino}, {LOWER: acid}, {LOWER: change}]}
      - {literal: "variant", label: "MUTATION", pattern: [{LOWER: variant}]}
      - {literal: "point mutation", label: "MUTATION", pattern: [{LOWER: point}, {LOWER: mutation}]}
    value_regex: '([A-Z]\\d+[A-Z]|\\d+\\w+\\s*(?:del|ins|dup))'
    value_type: list
    context_filters: [negated, uncertain]
  - field: assay_type
    target_rules:
      - {literal: "RT-PCR", label: "ASSAY", pattern: [{ORTH: RT}, {ORTH: "-"}, {ORTH: PCR}]}
      - {literal: "ELISA", label: "ASSAY", pattern: [{ORTH: ELISA}]}
      - {literal: "Western blot", label: "ASSAY", pattern: [{ORTH: Western}, {LOWER: blot}]}
      - {literal: "flow cytometry", label: "ASSAY", pattern: [{LOWER: flow}, {LOWER: cytometry}]}
      - {literal: "immunofluorescence", label: "ASSAY"}
      - {literal: "plaque assay", label: "ASSAY", pattern: [{LOWER: plaque}, {LOWER: assay}]}
    value_type: string
    context_filters: [negated]
  - field: experimental_system
    target_rules:
      - {literal: "in vitro", label: "SYSTEM", pattern: [{LOWER: in}, {LOWER: vitro}]}
      - {literal: "in vivo", label: "SYSTEM", pattern: [{LOWER: in}, {LOWER: vivo}]}
      - {literal: "cell culture", label: "SYSTEM", pattern: [{LOWER: cell}, {LOWER: culture}]}
      - {literal: "animal model", label: "SYSTEM", pattern: [{LOWER: animal}, {LOWER: model}]}
      - {literal: "mouse model", label: "SYSTEM", pattern: [{LOWER: mouse}, {LOWER: model}]}
      - {literal: "guinea pig", label: "SYSTEM", pattern: [{LOWER: guinea}, {LOWER: pig}]}
      - {literal: "nonhuman primate", label: "SYSTEM", pattern: [{LOWER: nonhuman}, {LOWER: primate}]}
      - {literal: "computational", label: "SYSTEM", pattern: [{LOWER: computational}]}
    value_type: string
    context_filters: [negated]
  - field: phenotype_observed
    target_rules:
      - {literal: "phenotype", label: "PHENOTYPE", pattern: [{LOWER: phenotype}]}
      - {literal: "virulence", label: "PHENOTYPE", pattern: [{LOWER: virulence}]}
      - {literal: "pathogenicity", label: "PHENOTYPE", pattern: [{LOWER: pathogenicity}]}
      - {literal: "lethality", label: "PHENOTYPE", pattern: [{LOWER: lethality}]}
      - {literal: "replication efficiency", label: "PHENOTYPE", pattern: [{LOWER: replication}, {LOWER: efficiency}]}
      - {literal: "cytopathic effect", label: "PHENOTYPE", pattern: [{LOWER: cytopathic}, {LOWER: effect}]}
      - {literal: "plaque morphology", label: "PHENOTYPE", pattern: [{LOWER: plaque}, {LOWER: morphology}]}
    value_type: string
    context_filters: [negated, uncertain]
    section_boost: [results, conclusions]
  - field: species_context
    target_rules:
      - {literal: "Bundibugyo virus", label: "SPECIES"}
      - {literal: "Ebola virus", label: "SPECIES"}
      - {literal: "Sudan virus", label: "SPECIES"}
      - {literal: "Taï Forest virus", label: "SPECIES"}
      - {literal: "Reston virus", label: "SPECIES"}
    value_type: string
    context_filters: [negated]
  - field: age_group
    target_rules:
      - {literal: "children", label: "AGE", pattern: [{LOWER: children}]}
      - {literal: "adults", label: "AGE", pattern: [{LOWER: adults}]}
      - {literal: "age group", label: "AGE", pattern: [{LOWER: age}, {LOWER: group}]}
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(patients|participants|individuals|people)\\b'
  - field: gender
    target_rules:
      - {literal: "male", label: "GENDER", pattern: [{LOWER: male}]}
      - {literal: "female", label: "GENDER", pattern: [{LOWER: female}]}
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(patients|participants|individuals|people)\\b'
  - field: geographic_location
    target_rules:
      - {literal: "conducted in", label: "LOCATION", pattern: [{LOWER: conducted}, {LOWER: in}]}
      - {literal: "located in", label: "LOCATION", pattern: [{LOWER: located}, {LOWER: in}]}
      - {literal: "reported in", label: "LOCATION", pattern: [{LOWER: reported}, {LOWER: in}]}
      - {literal: "outbreak in", label: "LOCATION", pattern: [{LOWER: outbreak}, {LOWER: in}]}
    value_regex: '(?:conducted|located|reported|identified|outbreak)\\s+(?:in|at|across|throughout)\\s+([A-Z][A-Za-z]+(?:\\s+[A-Z][A-Za-z]+)*(?:,\\s*[A-Za-z\\s]+)?)'
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(outbreak|cases|patients|study|survey|samples|detected|reported)\\b'

vaccine_therapeutic:
  - field: product_name
    target_rules:
      - {literal: "vaccine", label: "PRODUCT", pattern: [{LOWER: vaccine}]}
      - {literal: "rVSV-ZEBOV", label: "PRODUCT"}
      - {literal: "Ervebo", label: "PRODUCT"}
      - {literal: "ZMapp", label: "PRODUCT"}
      - {literal: "remdesivir", label: "PRODUCT", pattern: [{LOWER: remdesivir}]}
      - {literal: "favipiravir", label: "PRODUCT", pattern: [{LOWER: favipiravir}]}
      - {literal: "monoclonal antibody", label: "PRODUCT", pattern: [{LOWER: monoclonal}, {LOWER: antibody}]}
      - {literal: "therapeutic", label: "PRODUCT", pattern: [{LOWER: therapeutic}]}
      - {literal: "antiviral", label: "PRODUCT", pattern: [{LOWER: antiviral}]}
      - {literal: "convalescent plasma", label: "PRODUCT", pattern: [{LOWER: convalescent}, {LOWER: plasma}]}
    value_type: list
    context_filters: [negated, uncertain]
  - field: product_type
    target_rules:
      - {literal: "vaccine", label: "TYPE", pattern: [{LOWER: vaccine}]}
      - {literal: "monoclonal antibody", label: "TYPE", pattern: [{LOWER: monoclonal}, {LOWER: antibody}]}
      - {literal: "antiviral", label: "TYPE", pattern: [{LOWER: antiviral}]}
      - {literal: "small molecule", label: "TYPE", pattern: [{LOWER: small}, {LOWER: molecule}]}
      - {literal: "nucleotide analog", label: "TYPE", pattern: [{LOWER: nucleotide}, {LOWER: analog}]}
    value_type: string
    context_filters: [negated]
  - field: efficacy_value
    target_rules:
      - {literal: "efficacy", label: "METRIC", pattern: [{LOWER: efficacy}]}
      - {literal: "effectiveness", label: "METRIC", pattern: [{LOWER: effectiveness}]}
      - {literal: "protective efficacy", label: "METRIC", pattern: [{LOWER: protective}, {LOWER: efficacy}]}
      - {literal: "survival rate", label: "METRIC", pattern: [{LOWER: survival}, {LOWER: rate}]}
    value_regex: '(\\d+\.?\\d*)\\s*%\\s*(?:efficacy|effective|protection|survival)|(?:efficacy|effective|protection|survival).*?(\\d+\.?\\d*)\\s*%|(?:efficacy|effectiveness)\\s*(?:of|was)\\s*(\\d+\.?\\d*)'
    value_type: string
    context_filters: [negated, uncertain]
    section_boost: [results, conclusions]
  - field: endpoint
    target_rules:
      - {literal: "primary endpoint", label: "ENDPOINT", pattern: [{LOWER: primary}, {LOWER: endpoint}]}
      - {literal: "clinical endpoint", label: "ENDPOINT", pattern: [{LOWER: clinical}, {LOWER: endpoint}]}
      - {literal: "survival", label: "ENDPOINT", pattern: [{LOWER: survival}]}
      - {literal: "mortality", label: "ENDPOINT", pattern: [{LOWER: mortality}]}
    value_type: string
    context_filters: [negated]
  - field: study_phase
    target_rules:
      - {literal: "phase I", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: I}]}
      - {literal: "phase II", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: II}]}
      - {literal: "phase III", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: III}]}
      - {literal: "phase 1", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: "1"}]}
      - {literal: "phase 2", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: "2"}]}
      - {literal: "phase 3", label: "PHASE", pattern: [{LOWER: phase}, {ORTH: "3"}]}
      - {literal: "preclinical", label: "PHASE", pattern: [{LOWER: preclinical}]}
      - {literal: "clinical trial", label: "PHASE", pattern: [{LOWER: clinical}, {LOWER: trial}]}
      - {literal: "randomized controlled trial", label: "PHASE", pattern: [{LOWER: randomized}, {LOWER: controlled}, {LOWER: trial}]}
    value_type: string
    context_filters: [negated]
  - field: population
    target_rules:
      - {literal: "participants", label: "POP", pattern: [{LOWER: participants}]}
      - {literal: "patients", label: "POP", pattern: [{LOWER: patients}]}
      - {literal: "healthy volunteers", label: "POP", pattern: [{LOWER: healthy}, {LOWER: volunteers}]}
      - {literal: "healthcare workers", label: "POP", pattern: [{LOWER: healthcare}, {LOWER: workers}]}
      - {literal: "ring vaccination", label: "POP", pattern: [{LOWER: ring}, {LOWER: vaccination}]}
    value_type: string
    context_filters: [negated]
  - field: adverse_events
    target_rules:
      - {literal: "adverse events", label: "AE", pattern: [{LOWER: adverse}, {LOWER: events}]}
      - {literal: "side effects", label: "AE", pattern: [{LOWER: side}, {LOWER: effects}]}
      - {literal: "safety profile", label: "AE", pattern: [{LOWER: safety}, {LOWER: profile}]}
      - {literal: "fever", label: "AE", pattern: [{LOWER: fever}]}
      - {literal: "injection site", label: "AE", pattern: [{LOWER: injection}, {LOWER: site}]}
      - {literal: "fatigue", label: "AE", pattern: [{LOWER: fatigue}]}
      - {literal: "myalgia", label: "AE", pattern: [{LOWER: myalgia}]}
      - {literal: "arthritis", label: "AE", pattern: [{LOWER: arthritis}]}
    value_type: list
    context_filters: [negated]
  - field: age_group
    target_rules:
      - {literal: "children", label: "AGE", pattern: [{LOWER: children}]}
      - {literal: "adults", label: "AGE", pattern: [{LOWER: adults}]}
      - {literal: "elderly", label: "AGE", pattern: [{LOWER: elderly}]}
      - {literal: "age group", label: "AGE", pattern: [{LOWER: age}, {LOWER: group}]}
    value_type: string
    context_filters: [negated]
  - field: gender
    target_rules:
      - {literal: "male", label: "GENDER", pattern: [{LOWER: male}]}
      - {literal: "female", label: "GENDER", pattern: [{LOWER: female}]}
    value_type: string
    context_filters: [negated]
  - field: geographic_location
    target_rules:
      - {literal: "conducted in", label: "LOCATION", pattern: [{LOWER: conducted}, {LOWER: in}]}
      - {literal: "study site", label: "LOCATION", pattern: [{LOWER: study}, {LOWER: site}]}
      - {literal: "located in", label: "LOCATION", pattern: [{LOWER: located}, {LOWER: in}]}
      - {literal: "reported in", label: "LOCATION", pattern: [{LOWER: reported}, {LOWER: in}]}
      - {literal: "outbreak in", label: "LOCATION", pattern: [{LOWER: outbreak}, {LOWER: in}]}
    value_regex: '(?:conducted|located|reported|identified|outbreak)\\s+(?:in|at|across|throughout)\\s+([A-Z][A-Za-z]+(?:\\s+[A-Z][A-Za-z]+)*(?:,\\s*[A-Za-z\\s]+)?)'
    value_type: string
    context_filters: [negated]
    context_regex: '\\b(outbreak|cases|patients|study|survey|samples|detected|reported|infection|diagnostic|evaluation)\\b'

diagnostic:
  - field: test_name
    target_rules:
      - {literal: "diagnostic test", label: "TEST", pattern: [{LOWER: diagnostic}, {LOWER: test}]}
      - {literal: "assay", label: "TEST", pattern: [{LOWER: assay}]}
      - {literal: "rapid diagnostic test", label: "TEST", pattern: [{LOWER: rapid}, {LOWER: diagnostic}, {LOWER: test}]}
      - {literal: "RDT", label: "TEST"}
      - {literal: "lateral flow", label: "TEST", pattern: [{LOWER: lateral}, {LOWER: flow}]}
      - {literal: "Xpert Ebola", label: "TEST"}
      - {literal: "RealStar", label: "TEST"}
      - {literal: "TaqMan", label: "TEST"}
    value_type: string
    context_filters: [negated]
  - field: test_type
    target_rules:
      - {literal: "RT-PCR", label: "TEST_TYPE", pattern: [{ORTH: RT}, {ORTH: "-"}, {ORTH: PCR}]}
      - {literal: "real-time PCR", label: "TEST_TYPE", pattern: [{LOWER: real}, {ORTH: "-"}, {LOWER: time}, {ORTH: PCR}]}
      - {literal: "ELISA", label: "TEST_TYPE", pattern: [{ORTH: ELISA}]}
      - {literal: "CRISPR", label: "TEST_TYPE", pattern: [{ORTH: CRISPR}]}
      - {literal: "next-generation sequencing", label: "TEST_TYPE", pattern: [{LOWER: next}, {ORTH: "-"}, {LOWER: generation}, {LOWER: sequencing}]}
      - {literal: "metagenomic sequencing", label: "TEST_TYPE", pattern: [{LOWER: metagenomic}, {LOWER: sequencing}]}
      - {literal: "rapid diagnostic test", label: "TEST_TYPE", pattern: [{LOWER: rapid}, {LOWER: diagnostic}, {LOWER: test}]}
      - {literal: "immunohistochemistry", label: "TEST_TYPE"}
    value_type: string
    context_filters: [negated]
  - field: sensitivity
    target_rules:
      - {literal: "sensitivity", label: "METRIC", pattern: [{LOWER: sensitivity}]}
      - {literal: "analytical sensitivity", label: "METRIC", pattern: [{LOWER: analytical}, {LOWER: sensitivity}]}
      - {literal: "diagnostic sensitivity", label: "METRIC", pattern: [{LOWER: diagnostic}, {LOWER: sensitivity}]}
    value_regex: '(\\d+\.?\\d*)\\s*%'
    value_type: string
    context_filters: [negated, uncertain]
    section_boost: [results, conclusions]
  - field: specificity
    target_rules:
      - {literal: "specificity", label: "METRIC", pattern: [{LOWER: specificity}]}
