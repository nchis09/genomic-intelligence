      - {literal: "serum", label: "SAMPLE", pattern: [{LOWER: serum}]}
      - {literal: "plasma", label: "SAMPLE", pattern: [{LOWER: plasma}]}
      - {literal: "oral swab", label: "SAMPLE", pattern: [{LOWER: oral}, {LOWER: swab}]}
      - {literal: "nasopharyngeal swab", label: "SAMPLE", pattern: [{LOWER: nasopharyngeal}, {LOWER: swab}]}
      - {literal: "urine", label: "SAMPLE", pattern: [{LOWER: urine}]}
      - {literal: "saliva", label: "SAMPLE", pattern: [{LOWER: saliva}]}
      - {literal: "tissue", label: "SAMPLE", pattern: [{LOWER: tissue}]}
      - {literal: "formalin-fixed", label: "SAMPLE"}
