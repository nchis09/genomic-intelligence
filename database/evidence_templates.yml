# Per-domain evidence extraction templates.
# Each item defines a field to attempt from the full-text .txt of a paper.
# The LLM also reports n (total sample size) for every domain.
# Types: number = exact numeric value; string = exact text; boolean = true/false; list = semicolon-separated items.
counts:
