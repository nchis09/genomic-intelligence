name: pgirl_nextstrain
channels:
  - nextstrain
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pip
  - git
  # Nextflow (shared pipeline orchestrator)
  - nextflow>=24.0
  # Nextstrain toolkit
  - nextstrain-cli>=8.0
  - augur>=34.0
  - auspice>=2.53
  - nextclade>=3.0
  # zstd: seasonal-flu ingest fetches LAPIS payloads compressed with zstd
  - zstd
  # Workflow manager (nextstrain/ebola uses Snakemake)
  - snakemake>=8.0
  # Alignment
  - mafft>=7.520
  # Tree building
  - iqtree>=2.2
  - raxml-ng>=1.2
  # Molecular clock / timetree
  - treetime>=0.11
  # Sequence utilities
  # blast: makeblastdb/blastn for GENOFLU_ASSIGN (vendored GenoFLU-multi)
  - blast
  - seqkit>=2.6
  - biopython>=1.83
  - csvtk>=0.30
  # Ingest dependencies
  # (ncbi-datasets + tsv-select/tsv-filter are used by the avian-flu NCBI
  # ingest; jq is used by the Ebola ingest)
  - ncbi-datasets-cli>=16.0
  - tsv-utils>=2.2
  - jq
  # openpyxl: vendored GenoFLU-multi (avian ingest) reads xlsx reference tables
  - openpyxl
  - pip:
      - bio
      - pandas>=2.0
      # epiweeks: seasonal-flu build scripts/calculate_epiweek.py
      - epiweeks
